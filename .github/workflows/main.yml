name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --upgrade "Cython<3.0.0" "setuptools<66.0.0" buildozer

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Удаляем старое, чтобы не тянуть ошибки
          rm -rf .buildozer
          # Принудительно принимаем все  лицензии Android заранее
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          # Запуск
          buildozer android debug
