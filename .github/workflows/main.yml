name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --upgrade "Cython<3.0.0" "setuptools<66.0.0" buildozer

      - name: Pre-install Android SDK Components
        run: |
          # 1. Создаем структуру папок ПРЯМО ТАМ, где их ищет Buildozer
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mkdir -p $SDK_DIR/licenses
          
          # 2. Скачиваем инструменты (wget надежнее)
          wget -q https://google.com
          unzip -q commandlinetools-linux-9477386_latest.zip
          
          # 3. Переносим содержимое правильно
          mv cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          # 4. Принимаем лицензии
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
          
          # 5. Принудительно ставим Build-tools 31.0.0 и платформу 31
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "build-tools;31.0.0" "platforms;android-31" "platform-tools"

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Теперь Buildozer увидит, что папка build-tools/31.0.0 уже существует
          buildozer android debug
