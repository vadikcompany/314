name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --upgrade "Cython<3.0.0" "setuptools<66.0.0" buildozer

      - name: Setup Android SDK manually
        run: |
          # 1. Создаем структуру папок
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          
          # 2. Скачиваем официальные инструменты командной строки (ссылка исправлена)
          curl -L https://google.com -o cmdline.zip
          unzip -q cmdline.zip -d $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # 3. Переименовываем папку для совместимости с Buildozer
          mv $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # 4. Принимаем лицензии
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Запускаем сборку. Теперь он увидит, что всё на месте.
          buildozer android debug
