name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          # Устанавливаем конкретные версии инструментов, которые не конфликтуют
          pip install --user --upgrade "Cython<3.0.0" buildozer setuptools

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Очистка старых попыток, если они были в кэше
          rm -rf .buildozer
          # Запуск сборки
          yes | buildozer android debug
        continue-on-error: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
